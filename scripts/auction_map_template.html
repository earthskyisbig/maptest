<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 아파트 경매물건 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size: 13px; color: #1f2937; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { background: #0f172a; color: #e2e8f0; border-bottom: 2px solid #1abc9c; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 7px 14px; }
  .bar.filters { background: #111c33; border-top: 1px solid #1e293b; padding: 6px 14px; }
  .bar.filters[hidden] { display: none !important; }
  header h1 { font-size: 15px; margin: 0 10px 0 0; color: #fff; }
  header h1 small { color: #94a3b8; font-weight: 400; margin-left: 8px; font-size: 11.5px; }
  .grp { display: flex; align-items: center; gap: 5px; }
  .grp label { color: #94a3b8; font-size: 12px; white-space: nowrap; }
  .grp .tilde { color: #64748b; }
  header select, header input[type=number], header input[type=date] { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 4px 7px; font-size: 12.5px; }
  header input[type=number] { width: 64px; }
  header input[type=date] { width: 128px; color-scheme: dark; }
  .seg { display: inline-flex; border: 1px solid #334155; border-radius: 6px; overflow: hidden; }
  .seg button { background: #1e293b; color: #94a3b8; border: 0; padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
  .seg button.on { background: #1abc9c; color: #04241e; font-weight: 600; }
  .tog { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: #cbd5e1; user-select: none; white-space: nowrap; }
  .tog input { accent-color: #1abc9c; }
  .btn { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
  .btn.on { background: #f59e0b; color: #1f1300; border-color: #f59e0b; }
  .btn.gold { border-color: #f59e0b; color: #fbbf24; }
  .btn.gold.on { background: #f59e0b; color: #1f1300; }
  .btn.ghost { background: transparent; color: #94a3b8; }
  #stat { margin-left: auto; color: #94a3b8; font-size: 12px; }
  #stat b { color: #1abc9c; }
  #fReset { padding: 3px 8px; }

  #stage { flex: 1; position: relative; display: flex; min-height: 0; }
  #kakao, #leaflet { position: absolute; inset: 0; }
  #leaflet[hidden], #kakao[hidden], #rvwrap[hidden], #keys[hidden], #favpanel[hidden] { display: none !important; }
  #rvwrap { position: absolute; right: 0; top: 0; bottom: 0; width: 45%; background: #000; border-left: 3px solid #f59e0b; z-index: 5; }
  #roadview { width: 100%; height: 100%; }
  #rvhint { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.6); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; z-index: 6; }
  #rvclose { position: absolute; right: 10px; top: 10px; z-index: 6; background: #fff; border: 0; border-radius: 6px; padding: 5px 9px; cursor: pointer; }

  #legend { position: absolute; left: 12px; bottom: 26px; z-index: 4; background: rgba(255,255,255,.95); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 10px 12px; font-size: 12px; max-width: 260px; }
  #legend .row { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
  #legend .dot { width: 12px; height: 12px; border-radius: 50%; background: #1abc9c; border: 2px solid #fff; box-shadow: 0 0 0 1px #0d7a68; }
  #legend .dot.gold { background: #f59e0b; box-shadow: 0 0 0 1px #b45309; }
  #legend .sw { width: 16px; height: 11px; border-radius: 2px; border: 1.5px solid; }
  #legend .muted { color: #6b7280; font-size: 11px; margin-top: 5px; line-height: 1.45; }

  #keys { position: absolute; right: 12px; top: 12px; z-index: 6; background: rgba(255,255,255,.97); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.2); padding: 12px 14px; width: 320px; }
  #keys h3 { margin: 0 0 8px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; }
  #keys h3 button { border: 0; background: #e5e7eb; border-radius: 4px; cursor: pointer; padding: 2px 7px; }
  #keys input { width: 100%; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 6px; font-size: 12.5px; }
  #keys .small { color: #6b7280; font-size: 11px; line-height: 1.5; }
  #keys .kstat { font-size: 11.5px; margin-bottom: 6px; }
  #keys .kstat b { color: #0d7a68; }
  #keys button.save { width: 100%; padding: 7px; border: 0; border-radius: 6px; background: #0f172a; color: #fff; cursor: pointer; margin-top: 4px; }

  #favpanel { position: absolute; right: 12px; top: 12px; z-index: 6; background: rgba(255,255,255,.97); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.2); width: 340px; max-height: 70%; display: flex; flex-direction: column; }
  #favpanel h3 { margin: 0; padding: 10px 12px; font-size: 13.5px; background: #f59e0b; color: #1f1300; border-radius: 10px 10px 0 0; display: flex; justify-content: space-between; align-items: center; }
  #favpanel h3 button { border: 0; background: rgba(0,0,0,.15); border-radius: 4px; cursor: pointer; padding: 2px 7px; }
  #favlist { overflow: auto; padding: 6px 8px; }
  .fav { display: flex; gap: 8px; align-items: center; padding: 7px 6px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 12px; }
  .fav:hover { background: #fff7ed; }
  .fav .fi { flex: 1; min-width: 0; }
  .fav .fi b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav .fi small { color: #6b7280; }
  .fav .rm { border: 0; background: #fee2e2; color: #991b1b; border-radius: 4px; cursor: pointer; padding: 2px 6px; }
  #favempty { color: #6b7280; padding: 14px; text-align: center; font-size: 12px; }

  .popup { font-size: 12.5px; line-height: 1.45; min-width: 300px; max-width: 380px; }
  .popup .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; background: #1abc9c; color: #04241e; border-radius: 10px 10px 0 0; font-weight: 700; }
  .popup .hd.fav { background: #f59e0b; color: #1f1300; }
  .popup .hd .x { cursor: pointer; background: rgba(0,0,0,.15); border: 0; border-radius: 4px; width: 22px; height: 22px; font-size: 14px; line-height: 1; }
  .popup .bd { padding: 8px 12px 10px; background: #fff; border-radius: 0 0 10px 10px; max-height: 360px; overflow: auto; }
  .popup table { border-collapse: collapse; width: 100%; }
  .popup td { padding: 2px 6px 2px 0; vertical-align: top; }
  .popup td:first-child { color: #6b7280; white-space: nowrap; width: 72px; }
  .popup .price { font-size: 14px; font-weight: 700; color: #0d7a68; }
  .popup .tag { display: inline-block; background: #fef3c7; color: #92400e; border-radius: 4px; padding: 0 5px; margin: 1px 2px 1px 0; font-size: 11px; }
  .popup .zone { background: #f3e8ff; color: #6b21a8; border-radius: 6px; padding: 4px 7px; margin-top: 6px; }
  .popup .acts { display: flex; gap: 6px; margin-top: 8px; }
  .popup .acts button { flex: 1; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .popup .rv { border: 1px solid #f59e0b; background: #fff7ed; color: #9a3412; }
  .popup .star { border: 1px solid #d97706; background: #fffbeb; color: #92400e; font-weight: 600; }
  .popup .star.on { background: #f59e0b; color: #1f1300; }
  .kpop { position: relative; }
  .kpop::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
  .leaflet-popup-content { margin: 0 !important; }
  .leaflet-popup-content-wrapper { padding: 0; border-radius: 10px; overflow: hidden; }
  .leaflet-container { font: inherit; }
  .mint-cluster { background: rgba(26,188,156,.85); color: #fff; border-radius: 50%; text-align: center; font-weight: 700; border: 3px solid rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; transition: transform .15s; }
  .mint-cluster:hover { transform: scale(1.12); }

  /* 호버 툴팁 (두 엔진 공용) */
  .tip { background: #0f172a; color: #fff; padding: 6px 9px; border-radius: 7px; font-size: 12px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,.35); white-space: nowrap; pointer-events: none; position: relative; }
  .tip b { color: #5eead4; }
  .tip.fav b { color: #fcd34d; }
  .tip::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-top-color: #0f172a; border-bottom: 0; }
  .leaflet-tooltip.tipwrap { background: transparent; border: 0; box-shadow: none; padding: 0; }
  .leaflet-tooltip.tipwrap::before { display: none; }
  .lmk { width: 26px; height: 26px; border-radius: 50%; background: #1abc9c; border: 3px solid #fff; box-shadow: 0 0 0 1px #0d7a68, 0 2px 6px rgba(0,0,0,.3); transition: transform .15s, box-shadow .15s; }
  .lmk.gold { background: #f59e0b; box-shadow: 0 0 0 1px #b45309, 0 2px 6px rgba(0,0,0,.3); }
  .leaflet-marker-icon:hover .lmk { transform: scale(1.35); box-shadow: 0 0 0 4px rgba(26,188,156,.35), 0 4px 12px rgba(0,0,0,.35); }
  .leaflet-marker-icon:hover .lmk.gold { box-shadow: 0 0 0 4px rgba(245,158,11,.4), 0 4px 12px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="app">
<header>
  <div class="bar">
    <h1>서울 아파트 경매물건 지도 <small id="subtitle"></small></h1>
    <div class="grp"><label>지도</label>
      <div class="seg" id="engine"><button data-v="kakao" class="on">카카오맵</button><button data-v="vworld">브이월드맵</button></div>
    </div>
    <div class="grp"><label>배경</label><div class="seg" id="basemap"></div></div>
    <label class="tog"><input type="checkbox" id="tgAuction" checked> 경매물건</label>
    <label class="tog"><input type="checkbox" id="tgZones"> 서울플랜+ 구역</label>
    <button class="btn" id="btnRv" title="카카오맵에서만 동작">📷 로드뷰</button>
    <button class="btn gold" id="btnFav">★ 관심물건 <span id="favCnt">0</span></button>
    <button class="btn" id="btnFilter">⚙ 필터</button>
    <button class="btn ghost" id="btnKeys" title="API 키 설정">🔑</button>
    <span id="stat"></span>
  </div>
  <div class="bar filters" id="filters">
    <div class="grp"><label>구</label><select id="fGu"><option value="">전체</option></select></div>
    <div class="grp"><label>유찰</label><input type="number" id="fFailMin" min="0" placeholder="0"><span class="tilde">~</span><input type="number" id="fFailMax" min="0" placeholder="∞"><label>회</label></div>
    <div class="grp"><label>면적</label><input type="number" id="fAreaMin" min="0" placeholder="0"><span class="tilde">~</span><input type="number" id="fAreaMax" min="0" placeholder="∞"><label>㎡</label></div>
    <div class="grp"><label>감정가</label><input type="number" id="fApprMin" min="0" step="0.5" placeholder="0"><span class="tilde">~</span><input type="number" id="fApprMax" min="0" step="0.5" placeholder="∞"><label>억</label></div>
    <div class="grp"><label>최저가</label><input type="number" id="fBidMin" min="0" step="0.5" placeholder="0"><span class="tilde">~</span><input type="number" id="fBidMax" min="0" step="0.5" placeholder="∞"><label>억</label></div>
    <div class="grp"><label>매각기일</label><input type="date" id="fDateMin"><span class="tilde">~</span><input type="date" id="fDateMax"></div>
    <label class="tog"><input type="checkbox" id="fZoneOnly"> 정비구역 내만</label>
    <label class="tog"><input type="checkbox" id="fFavOnly"> 관심물건만</label>
    <button class="btn ghost" id="fReset">초기화</button>
  </div>
</header>
<div id="stage">
  <div id="kakao"></div>
  <div id="leaflet" hidden></div>
  <div id="rvwrap" hidden>
    <div id="rvhint">지도를 클릭하면 그 지점의 로드뷰를 보여줍니다</div>
    <button id="rvclose">닫기 ✕</button>
    <div id="roadview"></div>
  </div>
  <div id="legend">
    <div class="row"><span class="dot"></span> 경매물건(아파트) · 숫자는 클러스터 건수</div>
    <div class="row"><span class="dot gold"></span> 관심물건(저장됨)</div>
    <div id="zoneLegend"></div>
    <div class="muted" id="legendMeta"></div>
  </div>
  <div id="keys" hidden>
    <h3><span>API 키</span><button id="kClose" title="접기">▲ 접기</button></h3>
    <div class="kstat" id="kStat"></div>
    <input type="password" id="kKakao" placeholder="카카오 JavaScript 앱키" autocomplete="off">
    <input type="password" id="kVworld" placeholder="VWorld 인증키 (브이월드맵 배경용)" autocomplete="off">
    <div class="small">키는 이 브라우저의 localStorage에만 저장됩니다. 카카오: developers.kakao.com → 앱 키 → JavaScript 키, 플랫폼 Web 도메인에 실행 주소 등록. VWorld: vworld.kr → 오픈API 인증키.</div>
    <button class="save" id="kSave">저장</button>
  </div>
  <div id="favpanel" hidden>
    <h3><span>★ 관심물건 <span id="favCnt2">0</span>건</span><span><button id="favExport" title="목록 복사">복사</button> <button id="favClose">✕</button></span></h3>
    <div id="favlist"></div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
// ═══════════════════ 데이터 (빌드 시 주입) ═══════════════════
var DATA = __DATA__;
var MINT = '#1abc9c', GOLD = '#f59e0b';
var ITEMS = DATA.auction.features.filter(function(f){ return f.geometry; })
  .map(function(f){ var p = f.properties; p._lon = f.geometry.coordinates[0]; p._lat = f.geometry.coordinates[1]; return p; });
var BYID = {}; ITEMS.forEach(function(p){ BYID[p.id] = p; });
var ZONES = DATA.zones.features;
function $(id){ return document.getElementById(id); }

// ═══════════════════ 관심물건 (localStorage) ═══════════════════
var FAV = {};
try { FAV = JSON.parse(localStorage.getItem('auction_favs') || '{}'); } catch(e){ FAV = {}; }
function isFav(id){ return !!FAV[id]; }
function toggleFav(id){
  if(FAV[id]) delete FAV[id]; else FAV[id] = { at: new Date().toISOString(), case_no: BYID[id] && BYID[id].case_no };
  try { localStorage.setItem('auction_favs', JSON.stringify(FAV)); } catch(e){}
  updateFavUI(); restyleMarker(id);
  if($('fFavOnly').checked) refresh();
}
function updateFavUI(){
  var n = Object.keys(FAV).filter(function(id){ return BYID[id]; }).length;
  $('favCnt').textContent = n; $('favCnt2').textContent = n;
  var list = Object.keys(FAV).filter(function(id){ return BYID[id]; }).sort(function(a, b){ return FAV[b].at < FAV[a].at ? -1 : 1; });
  $('favlist').innerHTML = list.length ? list.map(function(id){ var p = BYID[id];
    return '<div class="fav" data-id="' + id + '"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:' + GOLD + ';flex:none"></span>' +
      '<div class="fi"><b>' + esc(p.case_no) + ' · ' + esc(p.sigungu) + ' ' + esc(p.dong || '') + (p.building_name ? ' ' + esc(p.building_name) : '') + '</b>' +
      '<small>' + (p.area_m2 ? p.area_m2 + '㎡ · ' : '') + '최저 ' + won(p.min_bid) + ' · 유찰 ' + (p.fail_count || 0) + '회 · ' + (p.sale_date || '') + '</small></div>' +
      '<button class="rm" data-rm="' + id + '" title="삭제">✕</button></div>'; }).join('') : '<div id="favempty">팝업의 ★ 버튼으로 관심물건을 저장하세요.</div>';
}
$('favlist').addEventListener('click', function(e){
  var rm = e.target.closest('[data-rm]'); if(rm){ toggleFav(rm.dataset.rm); return; }
  var row = e.target.closest('.fav'); if(row) focusItem(row.dataset.id);
});
$('btnFav').onclick = function(){ $('favpanel').hidden = !$('favpanel').hidden; $('keys').hidden = true; };
$('favClose').onclick = function(){ $('favpanel').hidden = true; };
$('favExport').onclick = function(){
  var lines = Object.keys(FAV).filter(function(id){ return BYID[id]; }).map(function(id){ var p = BYID[id];
    return [p.case_no, p.item_no, p.sigungu, p.address, p.area_m2, p.appraisal, p.min_bid, p.fail_count, p.sale_date].join('\t'); });
  var txt = '사건번호\t물건\t구\t소재지\t면적㎡\t감정가\t최저가\t유찰\t매각기일\n' + lines.join('\n');
  navigator.clipboard && navigator.clipboard.writeText(txt).then(function(){ $('favExport').textContent = '복사됨'; setTimeout(function(){ $('favExport').textContent = '복사'; }, 1200); });
};
function focusItem(id){
  var p = BYID[id]; if(!p) return;
  if(ENGINE === 'kakao' && K.ready){ var pos = new kakao.maps.LatLng(p._lat, p._lon); K.map.setLevel(3); K.map.setCenter(pos); kakaoPopup(p, pos); }
  else if(Lf.ready){ Lf.map.setView([p._lat, p._lon], 17); var m = Lf.markers.find(function(m){ return m._p.id === id; }); if(m){ Lf.cluster.zoomToShowLayer(m, function(){ m.openPopup(); }); } }
}

// ═══════════════════ 키 (접이식) ═══════════════════
var KAKAO_KEY = localStorage.getItem('kakao_app_key') || '';
var VWORLD_KEY = localStorage.getItem('vworld_key') || '';
function keyStat(){ $('kStat').innerHTML = '카카오 ' + (KAKAO_KEY ? '<b>저장됨</b>' : '<span style="color:#b91c1c">미설정</span>') + ' · VWorld ' + (VWORLD_KEY ? '<b>저장됨</b>' : '<span style="color:#b91c1c">미설정</span>'); }
keyStat();
$('btnKeys').onclick = function(){ $('keys').hidden = !$('keys').hidden; $('favpanel').hidden = true; };
$('kClose').onclick = function(){ $('keys').hidden = true; };
$('kSave').onclick = function(){
  var a = $('kKakao').value.trim(), b = $('kVworld').value.trim(), reload = false;
  if(a && a !== KAKAO_KEY){ localStorage.setItem('kakao_app_key', a); reload = true; }
  if(b && b !== VWORLD_KEY){ localStorage.setItem('vworld_key', b); VWORLD_KEY = b; if(Lf.ready) leafletBase(); }
  $('kKakao').value = ''; $('kVworld').value = ''; keyStat();
  $('keys').hidden = true;                      // 저장하면 접힌다
  if(reload) location.reload();
};
if(!KAKAO_KEY) $('keys').hidden = false;

// ═══════════════════ 공통: 포맷·팝업 ═══════════════════
function won(v){ if(v == null) return '-'; var eok = Math.floor(v / 1e8), man = Math.round((v % 1e8) / 1e4);
  return (eok ? eok + '억 ' : '') + (man ? man.toLocaleString() + '만' : (eok ? '' : '0')) + '원'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function row(k, v){ return v == null || v === '' ? '' : '<tr><td>' + k + '</td><td>' + v + '</td></tr>'; }
function popupHtml(p, withRv){
  var fav = isFav(p.id);
  var tags = (p.special_conditions || '').split(', ').filter(Boolean).map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('');
  var zone = p.zone_name ? '<div class="zone">🏗 <b>' + esc(p.zone_name) + '</b> · ' + esc(p.zone_category || '') +
      (p.zone_subtype ? ' / ' + esc(p.zone_subtype) : '') + (p.zone_stage ? ' · ' + esc(p.zone_stage) : '') + '</div>' : '';
  return '<div class="popup"><div class="hd' + (fav ? ' fav' : '') + '"><span>' + (fav ? '★ ' : '') + esc(p.case_no) + ' <small>물건 ' + esc(p.item_no) + '</small></span><button class="x" data-close>✕</button></div>' +
    '<div class="bd"><table>' +
    row('법원', esc(p.court) + (p.dept ? ' · ' + esc(p.dept) : '')) +
    row('중복사건', esc(p.dup_case_no)) +

var gus = {}; ITEMS.forEach(function(p){ gus[p.sigungu] = (gus[p.sigungu] || 0) + 1; });

function num(id){ var v = parseFloat($(id).value); return isNaN(v) ? null : v; }
function filtered(){
  var gu = $('fGu').value, fmin = num('fFailMin'), fmax = num('fFailMax'), amin = num('fAreaMin'), amax = num('fAreaMax');
  var pmin = num('fApprMin'), pmax = num('fApprMax'), bmin = num('fBidMin'), bmax = num('fBidMax');
  var dmin = $('fDateMin').value, dmax = $('fDateMax').value, zo = $('fZoneOnly').checked, fo = $('fFavOnly').checked;
  return ITEMS.filter(function(p){
    if(gu && p.sigungu !== gu) return false;
    var fc = p.fail_count || 0; if(fmin != null && fc < fmin) return false; if(fmax != null && fc > fmax) return false;
    if(amin != null && !(p.area_m2 >= amin)) return false; if(amax != null && !(p.area_m2 <= amax)) return false;
    if(pmin != null && !(p.appraisal >= pmin * 1e8)) return false; if(pmax != null && !(p.appraisal <= pmax * 1e8)) return false;
    if(bmin != null && !(p.min_bid >= bmin * 1e8)) return false; if(bmax != null && !(p.min_bid <= bmax * 1e8)) return false;
    if(dmin && !(p.sale_date >= dmin)) return false; if(dmax && !(p.sale_date <= dmax)) return false;
    if(zo && !p.zone_name) return false;
    if(fo && !isFav(p.id)) return false;
    return true;
  });
}

var K = { map: null, clusterer: null, markers: null, polys: [], popup: null, popupId: null, tip: null, rv: null, rvClient: null, rvOn: false, rvMarker: null, ready: false, loading: false, imgs: {} };
function initKakao(){
  if(!KAKAO_KEY){ return; }
  if(K.ready){ setTimeout(relayoutAll, 30); return; }
  if(K.loading) return; K.loading = true;
  var s = document.createElement('script');
  s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_KEY + '&autoload=false&libraries=clusterer';
  s.onload = function(){ kakao.maps.load(buildKakao); };
  s.onerror = function(){ alert('카카오 SDK 로드 실패: 앱키·등록 도메인을 확인하세요.'); };
  document.head.appendChild(s);
}
// (색, 호버) 조합으로 MarkerImage 캐시 — 물건마다 만들지 않는다
function markerImage(color, hover){
  var key = color + (hover ? 'h' : '');
  if(K.imgs[key]) return K.imgs[key];
  var size = hover ? 36 : 26, r = hover ? 12 : 9, ring = color === GOLD ? '#b45309' : '#0d7a68';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '">' +
    (hover ? '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + (size/2 - 1) + '" fill="' + color + '" fill-opacity=".28"/>' : '') +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="' + color + '" stroke="#fff" stroke-width="3"/>' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + (r + 2.5) + '" fill="none" stroke="' + ring + '" stroke-width="1"/></svg>';
  K.imgs[key] = new kakao.maps.MarkerImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg), new kakao.maps.Size(size, size), { offset: new kakao.maps.Point(size / 2, size / 2) });
  return K.imgs[key];
}
function buildKakao(){
  K.map = new kakao.maps.Map($('kakao'), { center: new kakao.maps.LatLng(37.5565, 126.99), level: 8 });
  K.map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  K.clusterer = new kakao.maps.MarkerClusterer({ map: K.map, averageCenter: true, minLevel: 4, gridSize: 70, disableClickZoom: false,
    styles: [{ width: '38px', height: '38px', background: 'rgba(26,188,156,.88)', color: '#fff', textAlign: 'center', lineHeight: '38px', borderRadius: '19px', fontWeight: '700', border: '3px solid rgba(255,255,255,.9)', boxShadow: '0 2px 8px rgba(0,0,0,.25)' },
             { width: '46px', height: '46px', background: 'rgba(22,160,133,.9)', color: '#fff', textAlign: 'center', lineHeight: '46px', borderRadius: '23px', fontWeight: '700', border: '3px solid rgba(255,255,255,.9)' },
             { width: '56px', height: '56px', background: 'rgba(13,122,104,.92)', color: '#fff', textAlign: 'center', lineHeight: '56px', borderRadius: '28px', fontWeight: '700', border: '3px solid rgba(255,255,255,.9)' }],
    calculator: [10, 50] });
  K.markers = ITEMS.map(function(p){
    var m = new kakao.maps.Marker({ position: new kakao.maps.LatLng(p._lat, p._lon), image: markerImage(isFav(p.id) ? GOLD : MINT, false), title: '' });
    m._p = p;
    kakao.maps.event.addListener(m, 'click', function(){ kakaoPopup(p, m.getPosition()); });
    kakao.maps.event.addListener(m, 'mouseover', function(){ m.setImage(markerImage(isFav(p.id) ? GOLD : MINT, true)); m.setZIndex(50); showTip(p, m.getPosition()); });
    kakao.maps.event.addListener(m, 'mouseout', function(){ m.setImage(markerImage(isFav(p.id) ? GOLD : MINT, false)); m.setZIndex(0); hideTip(); });
    return m;
  });
  ZONES.forEach(function(f){
    var g = f.geometry, p = f.properties, rings = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
    rings.forEach(function(pc){
      var poly = new kakao.maps.Polygon({ path: pc.map(function(r){ return r.map(function(c){ return new kakao.maps.LatLng(c[1], c[0]); }); }),
        strokeWeight: 1.2, strokeColor: p.color, strokeOpacity: .9, fillColor: p.color, fillOpacity: .22, zIndex: 1 });
      kakao.maps.event.addListener(poly, 'click', function(e){ if(K.rvOn) return; zonePopup(p, e.latLng); });
      kakao.maps.event.addListener(poly, 'mouseover', function(){ poly.setOptions({ fillOpacity: .42 }); });
      kakao.maps.event.addListener(poly, 'mouseout', function(){ poly.setOptions({ fillOpacity: .22 }); });
      K.polys.push(poly);
    });
  });
  kakao.maps.event.addListener(K.map, 'click', function(e){ if(K.rvOn) moveRoadview(e.latLng); else closeKakaoPopup(); });
  K.ready = true; K.loading = false;
  kakaoBase(); kakaoRefresh();
}
function showTip(p, pos){
  hideTip();
  var el = document.createElement('div'); el.innerHTML = tipHtml(p);
  K.tip = new kakao.maps.CustomOverlay({ content: el, position: pos, yAnchor: 1.45, zIndex: 15, clickable: false });
  K.tip.setMap(K.map);
}
function hideTip(){ if(K.tip){ K.tip.setMap(null); K.tip = null; } }
function kakaoBase(){
  if(!K.ready) return;
  var v = baseSel.kakao;
  K.map.setMapTypeId(v === 'roadmap' ? kakao.maps.MapTypeId.ROADMAP : v === 'skyview' ? kakao.maps.MapTypeId.SKYVIEW : kakao.maps.MapTypeId.HYBRID);
}
function kakaoRefresh(){
  if(!K.ready) return;

  if(on){ var set = {}; list.forEach(function(p){ set[p.id] = 1; }); K.clusterer.addMarkers(K.markers.filter(function(m){ return set[m._p.id]; })); }
  var z = $('tgZones').checked;

function overlayEl(html){
  var el = document.createElement('div'); el.className = 'kpop'; el.innerHTML = html;
  ['mousedown','mouseup','click','dblclick','touchstart','touchend','wheel'].forEach(function(t){ el.addEventListener(t, function(e){ e.stopPropagation(); kakao.maps.event.preventMap(); }); });
  el.querySelector('[data-close]').addEventListener('click', closeKakaoPopup);
  var rv = el.querySelector('[data-rv]'); if(rv) rv.addEventListener('click', function(){ var c = rv.dataset.rv.split(','); openRoadview(new kakao.maps.LatLng(+c[0], +c[1])); });
  var st = el.querySelector('[data-fav]'); if(st) st.addEventListener('click', function(){ toggleFav(st.dataset.fav); });
  return el;
}
function kakaoPopup(p, pos){

}
function zonePopup(p, pos){

    row('구분', esc(p.category)) + row('사업유형', esc(p.subtype)) + row('추진단계', esc(p.stage)) + row('자치구', esc(p.sigungu)) + row('면적', p.area_m2 ? p.area_m2.toLocaleString() + ' ㎡' : null) + '</table></div></div>';
  K.popup = new kakao.maps.CustomOverlay({ content: overlayEl(html), position: pos, yAnchor: 1.12, zIndex: 20 });

$('btnRv').onclick = function(){ if(ENGINE !== 'kakao' || !K.ready) return; K.rvOn ? closeRoadview() : openRoadview(K.map.getCenter()); };

function openRoadview(latlng){

function moveRoadview(latlng){

var Lf = { map: null, base: null, hybrid: null, cluster: null, markers: null, zones: null, ready: false, icons: {} };
function vworldUrl(layer){ var ext = layer === 'Satellite' ? 'jpeg' : 'png'; return 'https://api.vworld.kr/req/wmts/1.0.0/' + VWORLD_KEY + '/' + layer + '/{z}/{y}/{x}.' + ext; }
function lfIcon(fav){

  if(!Lf.icons[k]) Lf.icons[k] = L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -12], tooltipAnchor: [0, -14], html: '<div class="lmk' + (fav ? ' gold' : '') + '"></div>' });

}
function initLeaflet(){

  if(!VWORLD_KEY){
    Lf.osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'VWorld 키 미설정 — OSM 임시 배경' }).addTo(Lf.map);
    $('keys').hidden = false;
  }
  Lf.cluster = L.markerClusterGroup({ maxClusterRadius: 60, showCoverageOnHover: false,
    iconCreateFunction: function(c){ var n = c.getChildCount(), s = n < 10 ? 38 : n < 50 ? 46 : 56;
      return L.divIcon({ html: '<div class="mint-cluster" style="width:' + s + 'px;height:' + s + 'px">' + n + '</div>', className: '', iconSize: [s, s] }); } });
  Lf.markers = ITEMS.map(function(p){
    var m = L.marker([p._lat, p._lon], { icon: lfIcon(isFav(p.id)) }); m._p = p;
    m.bindPopup(function(){ return popupHtml(p, false); }, { maxWidth: 400 });

    return m;
  });
  Lf.zones = L.geoJSON(DATA.zones, { style: function(f){ return { color: f.properties.color, weight: 1.2, fillColor: f.properties.color, fillOpacity: .22 }; },
    onEachFeature: function(f, l){ var p = f.properties;
      l.on('mouseover', function(){ l.setStyle({ fillOpacity: .42 }); }); l.on('mouseout', function(){ l.setStyle({ fillOpacity: .22 }); });
      l.bindPopup('<div class="popup"><div class="hd" style="background:' + p.color + ';color:#fff"><span>' + esc(p.name) + '</span></div><div class="bd"><table>' +
      row('구분', esc(p.category)) + row('사업유형', esc(p.subtype)) + row('추진단계', esc(p.stage)) + row('자치구', esc(p.sigungu)) + row('면적', p.area_m2 ? p.area_m2.toLocaleString() + ' ㎡' : null) + '</table></div></div>', { maxWidth: 360 }); } });
  Lf.map.on('popupopen', function(e){ var el = e.popup.getElement();
    var x = el.querySelector('[data-close]'); if(x) x.onclick = function(){ Lf.map.closePopup(); };
    var st = el.querySelector('[data-fav]'); if(st) st.onclick = function(){ toggleFav(st.dataset.fav); }; });

function leafletBase(){

  if(Lf.osm){ Lf.map.removeLayer(Lf.osm); Lf.osm = null; }
  if(Lf.base) Lf.map.removeLayer(Lf.base); if(Lf.hybrid){ Lf.map.removeLayer(Lf.hybrid); Lf.hybrid = null; }
  var v = baseSel.vworld, opt = { maxZoom: 19, minZoom: 6, attribution: '© VWorld 국토교통부' };
  Lf.base = L.tileLayer(vworldUrl(v === 'Hybrid' ? 'Satellite' : v), opt).addTo(Lf.map);
  if(v === 'Hybrid') Lf.hybrid = L.tileLayer(vworldUrl('Hybrid'), { maxZoom: 19, minZoom: 6 }).addTo(Lf.map);
  Lf.base.bringToBack(); if(Lf.hybrid) Lf.hybrid.bringToBack();
}
function leafletRefresh(){
  if(!Lf.ready) return;
  var list = filtered(), on = $('tgAuction').checked;
  Lf.cluster.clearLayers();
  if(on){ var set = {}; list.forEach(function(p){ set[p.id] = 1; }); Lf.cluster.addLayers(Lf.markers.filter(function(m){ return set[m._p.id]; })); }
  if(!Lf.map.hasLayer(Lf.cluster)) Lf.cluster.addTo(Lf.map);
  var z = $('tgZones').checked;
  if(z && !Lf.map.hasLayer(Lf.zones)) Lf.zones.addTo(Lf.map); if(!z && Lf.map.hasLayer(Lf.zones)) Lf.map.removeLayer(Lf.zones);
  updateStat(list);
}

// ═══════════════════ 시작 ═══════════════════
updateFavUI();
updateStat(ITEMS);
setEngine(ENGINE);
</script>
